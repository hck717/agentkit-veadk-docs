services:
  # Redis Stack（RediSearch + Vector + JSON）—— E3 對比用
  redis-stack:
    container_name: fin-mate-redis-stack
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
    volumes:
      - fin-mate-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # OpenViking：開源 Context Database for AI Agents（AGPLv3 自架，唔使 VikingDB cloud）
  # storage.vectordb.backend = local（內建 CuVS/local index），embedding/VLM 用宿主機 Ollama
  openviking:
    container_name: fin-mate-openviking
    image: ghcr.io/volcengine/openviking:latest
    ports:
      - "1933:1933"
    volumes:
      - ~/.openviking:/app/.openviking
    environment:
      OPENVIKING_SERVER_PORT: "1933"
      OPENVIKING_WITH_BOT: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # VeADK Web（統一管理：docker compose up -d 起晒 set 嘢，port 8000 入 UI）
  web:
    container_name: fin-mate-web
    build:
      context: .
      dockerfile: Dockerfile.web
    working_dir: /srv/fin_mate
    command: ["veadk", "web", "..", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/srv/fin_mate
    env_file:
      - .env
    environment:
      # 容器網絡內用 service name（唔好 localhost）
      DATABASE_OPENVIKING_URL: http://openviking:1933
      DATABASE_OPENVIKING_ACCOUNT: fin_mate
      DATABASE_OPENVIKING_USER: fin_mate_user
      DATABASE_OPENVIKING_USER_ID: fin_mate_user
      # OTLP trace → otel-collector（Jaeger 前線）
      OBSERVABILITY_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      # API key 由 .env 繼承（env_file）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      openviking:
        condition: service_healthy
    restart: unless-stopped

  # 輕量本地 Observability：OTLP collector → Jaeger（trace UI）
  # 只做 trace；OpenViking 內部觀察用佢內建 /api/v1/observer/* + ov CLI。
  otel-collector:
    container_name: fin-mate-otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    container_name: fin-mate-jaeger
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    restart: unless-stopped

volumes:
  fin-mate-redis-data: