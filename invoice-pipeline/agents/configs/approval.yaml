agent:
  name: approval_agent
  model: seed-2-0-mini-260428
  mock: true
  enable_a2ui: false
  reasoning_effort: minimal
short_term_memory:
  backend: sqlite
  local_database_path: ./stm_dev.db
approval:
  auto_approve_threshold: 10000
  flag_for_review:
    - max_amount: 50000
    - low_confidence: 0.8
  notification:
    provider: feishu
context_policy:
  max_input_tokens: 8000
  max_output_tokens: 4000
  window_strategy: sliding
  window_size: 10
  compaction_interval: 3
  overlap_size: 1
  max_session_messages: 50
