agent:
  name: validation_agent
  model: seed-2-0-mini-260428
  mock: true
  reasoning_effort: minimal
short_term_memory:
  backend: sqlite
  local_database_path: ./stm_dev.db
long_term_memory:
  backend: openviking
  app_name: invoice_ltm
validation:
  checks:
    - amount_vs_line_items
    - date_format
    - currency_consistency
  max_loopback_retries: 3
context_policy:
  max_input_tokens: 8000
  max_output_tokens: 4000
  window_strategy: sliding
  window_size: 15
  compaction_interval: 5
  overlap_size: 2
  max_session_messages: 100
